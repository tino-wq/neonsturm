<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05020d">
<title>NEONSTURM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEONSTURM">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Tektur:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: full-bleed arena canvas; HUD pinned to the safe-area corners; menus are neon placards over the live arena */
  --void:#05020d; --ink:#f4f0ff;
  --volt:#00f0ff; --volt-rgb:0,240,255;
  --hex:#ff2bd6;  --hex-rgb:255,43,214;
  --amp:#ffe14d;  --amp-rgb:255,225,77;
  --alarm:#ff3355; --alarm-rgb:255,51,85;
  --good:#3dff6e; --good-rgb:61,255,110;
  --display:"Tektur","Chakra Petch",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --body:"Chakra Petch",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--void);color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:none;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus-visible{outline:2px solid var(--amp);outline-offset:3px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
#vig{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse 130% 100% at 50% 50%,transparent 58%,rgba(0,0,0,.62) 100%);transition:box-shadow .4s}
body.od #vig{box-shadow:inset 0 0 90px rgba(var(--amp-rgb),.35)}
#dmg{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;background:radial-gradient(ellipse 120% 95% at 50% 50%,transparent 42%,rgba(var(--alarm-rgb),.6) 100%)}

/* HUD */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
#tl{position:absolute;top:calc(10px + var(--st));left:calc(14px + var(--sl))}
#score{font:700 26px/1.1 var(--display);letter-spacing:.02em;font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(var(--volt-rgb),.85),0 0 2px #fff}
#mrow{display:flex;align-items:center;gap:8px;margin-top:4px}
#mult{min-width:40px;font:900 16px/1 var(--display);color:var(--amp);text-shadow:0 0 10px rgba(var(--amp-rgb),.85);transform:skewX(-8deg)}
#mult.hot{color:var(--hex);text-shadow:0 0 12px var(--hex),0 0 24px var(--hex)}
.cbar{display:block;width:64px;height:4px;border-radius:2px;overflow:hidden;background:rgba(255,255,255,.13)}
#cfill{display:block;height:100%;background:var(--amp);box-shadow:0 0 8px var(--amp);transform-origin:0 50%;transform:scaleX(0)}
#hp{display:flex;gap:6px;margin-top:9px;padding-left:3px}
#hp i{display:block;width:15px;height:12px;border:2px solid rgba(var(--hex-rgb),.5);border-radius:2px;transform:skewX(-20deg)}
#hp i.on{background:var(--hex);border-color:#ffd3f5;box-shadow:0 0 10px var(--hex)}
#hp i.sh{background:#3d7bff;border-color:#c4d6ff;box-shadow:0 0 10px #3d7bff}
#hp i.shx{border-color:rgba(61,123,255,.5)}
#tc{position:absolute;top:calc(13px + var(--st));left:50%;width:min(52vw,440px);transform:translateX(-50%);text-align:center}
#wave{font:700 11px/1.2 var(--display);letter-spacing:.3em;white-space:nowrap;opacity:.85;text-shadow:0 0 8px rgba(var(--volt-rgb),.8)}
#bossbar{position:absolute;top:calc(34px + var(--st));left:50%;width:min(52vw,440px);transform:translateX(-50%);text-align:center}
@media (max-width:600px){#bossbar{top:calc(94px + var(--st));width:calc(100% - 28px - var(--sl) - var(--sr))}}
#sa{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:var(--st) 0 var(--sb) 0}
#bossname{margin-bottom:5px;font:900 11px/1.2 var(--display);letter-spacing:.24em;white-space:nowrap;color:var(--alarm);text-shadow:0 0 10px var(--alarm)}
.bbar{height:9px;border:1px solid rgba(var(--alarm-rgb),.75);border-radius:5px;overflow:hidden;background:rgba(var(--alarm-rgb),.12);box-shadow:0 0 14px rgba(var(--alarm-rgb),.45)}
#bfill{display:block;height:100%;background:linear-gradient(90deg,var(--hex),var(--alarm));box-shadow:0 0 10px var(--alarm);transform-origin:0 50%}
#pauseBtn{position:absolute;top:calc(9px + var(--st));right:calc(10px + var(--sr));width:44px;height:44px;display:flex;align-items:center;justify-content:center;gap:5px;pointer-events:auto;touch-action:none;border:1.5px solid rgba(var(--volt-rgb),.5);border-radius:10px;background:rgba(var(--volt-rgb),.06);box-shadow:0 0 10px rgba(var(--volt-rgb),.25)}
#pauseBtn i{display:block;width:4px;height:16px;border-radius:1px;background:var(--volt);box-shadow:0 0 8px var(--volt)}

/* Touch controls */
#ctl{position:fixed;inset:0;z-index:11;pointer-events:none}
.cb{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;pointer-events:auto;touch-action:none;background:conic-gradient(var(--k) calc(var(--p,1) * 360deg),rgba(255,255,255,.1) 0)}
.cb::before{content:"";position:absolute;inset:4px;border-radius:50%;background:rgba(6,3,18,.86)}
.cb span{position:relative;padding-left:.12em;font:900 11px/1.15 var(--display);letter-spacing:.12em;text-align:center}
.cb small{display:block;margin-top:3px;font:600 8px/1 var(--body);letter-spacing:.06em;opacity:.55}
body.touch .cb small,body.touch .key{display:none}
.cb.ready{box-shadow:0 0 16px var(--k),0 0 36px var(--k)}
.cb.ready span{text-shadow:0 0 10px var(--k)}
.cb:active{transform:scale(.92)}
#dashBtn{--k:var(--volt);width:84px;height:84px;right:calc(18px + var(--sr));bottom:calc(22px + var(--sb))}
#novaBtn{--k:var(--hex);width:66px;height:66px;right:calc(116px + var(--sr));bottom:calc(31px + var(--sb))}
#novaBtn.ready{animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.1)}}

/* Banners */
#hint{position:fixed;left:0;right:0;bottom:calc(30% + var(--sb));z-index:9;pointer-events:none;text-align:center;font:700 13px/1 var(--display);letter-spacing:.3em;color:var(--volt);text-shadow:0 0 10px var(--volt);animation:fade 1.3s ease-in-out infinite}
@keyframes fade{50%{opacity:.25}}
#banner{position:fixed;left:0;right:0;top:24%;z-index:12;pointer-events:none;text-align:center;opacity:0;--bc:var(--volt)}
#banner.show{animation:ban 2.5s cubic-bezier(.2,.8,.2,1) forwards}
#banner.danger{--bc:var(--alarm)}
#b1{font:900 clamp(34px,10.5vw,90px)/1 var(--display);letter-spacing:.04em;transform:skewX(-9deg);text-shadow:0 0 8px #fff,0 0 24px var(--bc),0 0 60px var(--bc)}
#banner.danger #b1{animation:blink .22s steps(2) 7}
#b2{margin-top:12px;padding:0 18px;font:600 clamp(13px,3.7vw,18px)/1.35 var(--body);letter-spacing:.06em;opacity:.92;text-shadow:0 0 10px var(--bc)}
@keyframes ban{0%{opacity:0;transform:scale(1.8)}12%{opacity:1;transform:scale(1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-16px) scale(.97)}}
@keyframes blink{50%{opacity:.2}}
#callout{position:fixed;left:0;right:0;top:37%;z-index:12;pointer-events:none;padding:0 10px;text-align:center;opacity:0;font:900 clamp(22px,6.6vw,44px)/1.1 var(--display);letter-spacing:.05em;color:var(--cc,var(--amp));text-shadow:0 0 10px var(--cc,var(--amp)),0 0 30px var(--cc,var(--amp))}
#callout.show{animation:pop 1.25s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(.4) rotate(-7deg)}14%{opacity:1;transform:scale(1.18) rotate(2deg)}28%{transform:scale(1) rotate(0)}72%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}

/* Screens */
.scr{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow-y:auto;touch-action:pan-y;text-align:center;
  padding:calc(18px + var(--st)) calc(16px + var(--sr)) calc(18px + var(--sb)) calc(16px + var(--sl));
  background:radial-gradient(ellipse at 50% 42%,rgba(36,10,70,.55),rgba(3,1,10,.88));-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fin .35s ease-out}
#title{background:radial-gradient(ellipse at 50% 45%,rgba(20,6,50,.15),rgba(3,1,10,.7));-webkit-backdrop-filter:none;backdrop-filter:none}
@keyframes fin{from{opacity:0}}
.eyebrow{padding-left:.55em;font:700 11px/1 var(--display);letter-spacing:.55em;color:var(--hex);text-shadow:0 0 10px var(--hex)}
.logo{position:relative;padding:0 .08em;font:900 clamp(42px,13.6vw,132px)/1 var(--display);letter-spacing:.01em;transform:skewX(-10deg);text-shadow:0 0 6px #fff,0 0 18px var(--volt),0 0 44px var(--volt),0 0 90px var(--hex)}
.gl::before,.gl::after{content:attr(data-t);position:absolute;inset:0;padding:inherit;text-shadow:none;pointer-events:none}
.gl::before{color:var(--hex);animation:g1 3.1s infinite steps(1)}
.gl::after{color:var(--volt);animation:g2 2.4s infinite steps(1)}
@keyframes g1{0%,11%,55%,100%{clip-path:inset(0 0 100% 0);transform:none}6%{clip-path:inset(12% 0 58% 0);transform:translate(-6px,1px)}8%{clip-path:inset(62% 0 8% 0);transform:translate(5px,-1px)}52%{clip-path:inset(38% 0 44% 0);transform:translate(7px,0)}}
@keyframes g2{0%,35%,83%,100%{clip-path:inset(0 0 100% 0);transform:none}30%{clip-path:inset(70% 0 12% 0);transform:translate(-7px,0)}32%{clip-path:inset(20% 0 66% 0);transform:translate(5px,1px)}80%{clip-path:inset(46% 0 32% 0);transform:translate(-5px,0)}}
.sub{max-width:34ch;font:500 clamp(14px,3.9vw,17px)/1.4 var(--body);letter-spacing:.04em;opacity:.88}
.btn{--k:var(--volt);--kr:var(--volt-rgb);min-width:220px;padding:15px 26px 15px calc(26px + .18em);border:2px solid var(--k);border-radius:9px;touch-action:manipulation;font:700 15px/1 var(--display);letter-spacing:.18em;background:rgba(var(--kr),.08);box-shadow:0 0 14px rgba(var(--kr),.45),inset 0 0 14px rgba(var(--kr),.2);text-shadow:0 0 8px rgba(var(--kr),.95)}
.btn:active{transform:scale(.96)}
.btn.pink{--k:var(--hex);--kr:var(--hex-rgb)}
.btn.big{min-width:250px;padding:19px 34px 19px calc(34px + .18em);font-size:21px;font-weight:900;animation:breathe 1.8s ease-in-out infinite}
.btn.sm{min-width:0;padding:10px 13px 10px calc(13px + .12em);border-width:1px;font-size:11px;letter-spacing:.12em;opacity:.85}
@keyframes breathe{50%{box-shadow:0 0 28px rgba(var(--kr),.85),inset 0 0 20px rgba(var(--kr),.35)}}
#best{font:700 12px/1.4 var(--display);letter-spacing:.2em;color:var(--amp);text-shadow:0 0 10px rgba(var(--amp-rgb),.7)}
.howto{max-width:40ch;font:500 13px/1.75 var(--body);opacity:.78}
.howto b{color:var(--volt);font-weight:700}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.h1{position:relative;padding:0 .08em;font:900 clamp(38px,11.5vw,94px)/1 var(--display);letter-spacing:.03em;transform:skewX(-9deg);text-shadow:0 0 8px #fff,0 0 24px var(--hex),0 0 60px var(--hex)}
.h2{font:900 clamp(24px,7vw,44px)/1.1 var(--display);letter-spacing:.04em;text-wrap:balance;transform:skewX(-8deg);text-shadow:0 0 8px #fff,0 0 22px var(--volt),0 0 50px var(--volt)}

/* Upgrade cards */
#cards{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;margin-top:4px}
.card{--k:var(--volt);--kr:var(--volt-rgb);position:relative;display:grid;grid-template-columns:52px 1fr;align-items:center;gap:14px;width:min(100%,440px);padding:16px 16px 15px;text-align:left;border:2px solid var(--k);border-radius:12px;touch-action:manipulation;
  background:linear-gradient(135deg,rgba(var(--kr),.14),rgba(10,4,30,.92) 62%);box-shadow:0 0 16px rgba(var(--kr),.38),inset 0 0 22px rgba(var(--kr),.1);animation:cin .5s cubic-bezier(.2,.9,.3,1.25) backwards}
.card.rare{--k:var(--hex);--kr:var(--hex-rgb)}
.card.heal{--k:var(--good);--kr:var(--good-rgb)}
.card:active{transform:scale(.97)}
@keyframes cin{from{opacity:0;transform:translateY(34px) scale(.9)}}
.ic{display:flex;align-items:center;justify-content:center;width:52px;height:52px;color:var(--k);filter:drop-shadow(0 0 6px var(--k))}
.ic svg{width:40px;height:40px}
.tx,.nm,.ds{display:block}
.nm{font:700 17px/1.2 var(--display);letter-spacing:.03em}
.ds{margin-top:4px;font:500 14px/1.35 var(--body);opacity:.88}
.lv{display:flex;gap:4px;margin-top:8px}
.lv i{display:block;width:14px;height:5px;border-radius:2px;background:rgba(255,255,255,.18)}
.lv i.on{background:var(--k);box-shadow:0 0 6px var(--k)}
.lv i.nx{background:#fff;animation:blink .6s steps(2) infinite}
.tagc{position:absolute;top:-9px;right:12px;padding:3px 7px;border-radius:4px;background:var(--k);color:var(--void);font:700 9.5px/1 var(--display);letter-spacing:.18em}
.key{position:absolute;bottom:8px;right:11px;font:700 11px/1 var(--display);opacity:.4}
@media (orientation:landscape) and (min-width:720px){#cards{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:stretch}.card{width:236px;grid-template-columns:1fr;justify-items:center;text-align:center;padding:22px 16px 18px}.lv{justify-content:center}}

/* Game over */
#final{font:900 clamp(34px,10vw,64px)/1 var(--display);font-variant-numeric:tabular-nums;text-shadow:0 0 14px var(--volt),0 0 2px #fff}
#newrec{font:900 14px/1 var(--display);letter-spacing:.22em;color:var(--amp);text-shadow:0 0 12px var(--amp);animation:blink .5s steps(2) infinite}
#stats{display:grid;grid-template-columns:repeat(2,minmax(110px,1fr));gap:12px 24px;margin:2px 0 6px;font:700 11px/1.2 var(--display);letter-spacing:.16em;opacity:.92}
#stats b{display:block;margin-top:4px;font-size:20px;letter-spacing:.02em;text-shadow:0 0 8px var(--volt)}
@media (min-width:600px){#stats{grid-template-columns:repeat(4,auto)}}
#build{max-width:44ch;font:500 12.5px/1.6 var(--body);opacity:.75}
@media (prefers-reduced-motion:reduce){.gl::before,.gl::after{display:none}.btn.big,#novaBtn.ready,#hint,#newrec,.lv i.nx,#banner.danger #b1{animation:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="Spielfeld"></canvas>
<div id="vig"></div>
<div id="dmg"></div>
<div id="sa" aria-hidden="true"></div>

<div id="hud" class="hidden">
  <div id="tl">
    <div id="score">0</div>
    <div id="mrow"><span id="mult">×1</span><span class="cbar"><i id="cfill"></i></span></div>
    <div id="hp"></div>
  </div>
  <div id="tc"><div id="wave">WELLE 1</div></div>
  <div id="bossbar" class="hidden"><div id="bossname">BOSS</div><div class="bbar"><i id="bfill"></i></div></div>
  <button id="pauseBtn" aria-label="Pause"><i></i><i></i></button>
</div>

<div id="ctl" class="hidden">
  <button class="cb" id="novaBtn" aria-label="Nova auslösen"><span>NOVA<small>E</small></span></button>
  <button class="cb" id="dashBtn" aria-label="Dash"><span>DASH<small>LEERTASTE</small></span></button>
</div>
<div id="hint" class="hidden">ZIEHEN ZUM FLIEGEN</div>
<div id="banner"><div id="b1"></div><div id="b2"></div></div>
<div id="callout"></div>

<section id="title" class="scr">
  <div class="eyebrow">ARENA-SHOOTER</div>
  <h1 class="logo gl" data-t="NEONSTURM">NEONSTURM</h1>
  <p class="sub">Überlebe den Sturm. So lange du kannst.</p>
  <button class="btn big" id="playBtn">SPIELEN</button>
  <div id="best"></div>
  <p class="howto" id="howto"></p>
  <div class="row"><button class="btn sm" id="sfxT">SOUND: AN</button><button class="btn sm" id="musT">MUSIK: AN</button></div>
</section>

<section id="upg" class="scr hidden">
  <h2 class="h2" id="upTitle">WELLE 1 GESCHAFFT</h2>
  <p class="sub">Wähle ein Upgrade</p>
  <div id="cards"></div>
</section>

<section id="pause" class="scr hidden">
  <h2 class="h1">PAUSE</h2>
  <button class="btn big" id="resumeBtn">WEITER</button>
  <button class="btn" id="restartBtn">NEU STARTEN</button>
  <button class="btn pink" id="menuBtn">HAUPTMENÜ</button>
  <div class="row"><button class="btn sm" id="sfxT2">SOUND: AN</button><button class="btn sm" id="musT2">MUSIK: AN</button></div>
  <p id="build"></p>
</section>

<section id="over" class="scr hidden">
  <h2 class="h1 gl" data-t="GAME OVER">GAME OVER</h2>
  <div id="newrec" class="hidden">★ NEUER REKORD ★</div>
  <div id="final">0</div>
  <div id="stats"></div>
  <button class="btn big" id="againBtn">NOCHMAL</button>
  <button class="btn pink" id="menuBtn2">HAUPTMENÜ</button>
</section>

<script>
(() => {
'use strict';

/* ================= helpers ================= */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rand = (a, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = arr => arr[(Math.random() * arr.length) | 0];
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU; return d; };
const fmt = n => Math.floor(n).toLocaleString('de-DE');
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const $ = id => document.getElementById(id);
const show = id => $(id).classList.remove('hidden');
const hide = id => $(id).classList.add('hidden');
const FONT = '"Tektur","Chakra Petch",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
const mq = q => !!(window.matchMedia && window.matchMedia(q).matches);
const isTouch = mq('(pointer: coarse)') || ('ontouchstart' in window);
const RM = mq('(prefers-reduced-motion: reduce)');
if (isTouch) document.body.classList.add('touch');
function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) { /* unsupported */ } }
const DBG = { timeMul: 1, god: false, autoPick: false };

/* ================= save ================= */
const SAVE_KEY = 'neonsturm-v1';
let save = {};
try { const raw = window.localStorage.getItem(SAVE_KEY); const s = raw ? JSON.parse(raw) : null; if (s && typeof s === 'object') save = s; } catch (e) { save = {}; }
function persist() { try { window.localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* storage blocked */ } }

/* ================= colours & glow sprites ================= */
const COL = { cyan: '#00f0ff', pink: '#ff2bd6', green: '#3dff6e', orange: '#ff8a1f', red: '#ff3355', yellow: '#ffe14d', purple: '#a35bff', blue: '#3d7bff', white: '#ffffff', gold: '#ffc83d', teal: '#00ffc3' };
const PAL = Object.keys(COL).map(k => COL[k]);
const CI = {}; PAL.forEach((c, i) => { CI[c] = i; });
const ci = c => (CI[c] !== undefined ? CI[c] : CI[COL.white]);
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; }
function makeGlow(color, soft) {
  const S = 64, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), gr = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  if (soft) { gr.addColorStop(0, rgba(color, 0.5)); gr.addColorStop(0.45, rgba(color, 0.16)); gr.addColorStop(1, rgba(color, 0)); }
  else { gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.14, rgba(color, 0.95)); gr.addColorStop(0.42, rgba(color, 0.28)); gr.addColorStop(1, rgba(color, 0)); }
  g.fillStyle = gr; g.fillRect(0, 0, S, S);
  return c;
}
const GLOW = {}, SOFT = {};
PAL.forEach(c => { GLOW[c] = makeGlow(c, false); SOFT[c] = makeGlow(c, true); });

/* ================= state ================= */

function drawTexts() {

  c.globalCompositeOperation = 'lighter';
  for (const e of enemies) {

  const c = ctx; c.setTransform(DPR, 0, 0, DPR, 0, 0); c.globalCompositeOperation = 'lighter';
  c.globalAlpha = 0.28; c.strokeStyle = COL.cyan; c.lineWidth = 2; c.beginPath(); c.arc(stick.ox, stick.oy, STICK_R, 0, TAU); c.stroke();
  c.globalAlpha = 0.08; c.fillStyle = COL.cyan; c.fill();

function bloom() {
  bAx.globalCompositeOperation = 'copy'; bAx.globalAlpha = 1; bAx.drawImage(cv, 0, 0, bA.width, bA.height);
  bBx.globalCompositeOperation = 'copy'; bBx.globalAlpha = 1; bBx.drawImage(bA, 0, 0, bB.width, bB.height);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'lighter';

function render() {
  const c = ctx;
  c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  c.fillStyle = '#04020b'; c.fillRect(0, 0, cv.width, cv.height);
  drawStars();
  const sh = trauma * trauma * 20, sx = (Math.random() * 2 - 1) * sh, sy = (Math.random() * 2 - 1) * sh;
  VS = DPR * zoom; VOX = DPR * (W / 2 + sx) - cam.x * VS; VOY = DPR * (H / 2 + sy) - cam.y * VS;
  drawGrid(); drawBorder(); drawPickups(); drawEnemies(); drawMissiles(); drawPBullets(); drawPlayer(); drawFX(); drawParts(); drawEBullets(); drawTexts();

/* ================= loop ================= */
const PERF = { acc: 0, n: 0, warm: 0 };
function perf(rdt) {
  if (state !== 'play') return;
  PERF.warm += rdt; if (PERF.warm < 4) return;
  PERF.acc += rdt; PERF.n++;
  if (PERF.acc >= 3) { const fps = PERF.n / PERF.acc; PERF.acc = 0; PERF.n = 0; if (fps < 40 && Q.level > 0) applyQuality(Q.level - 1); }
}
function demoStep(dt) {
  demo.t += dt;
  P.x = ARENA / 2 + Math.cos(demo.t * 0.37) * 330; P.y = ARENA / 2 + Math.sin(demo.t * 0.53) * 260; P.vx = 0; P.vy = 0;
  demo.spawnT -= dt;
  if (demo.spawnT <= 0 && enemies.length < 16) {
    demo.spawnT = 0.45;
    const a = rand(TAU), r = rand(260, 520);
    makeEnemy(pick(['drift', 'drift', 'dart', 'dart', 'split', 'mini', 'brute']), clamp(cam.x + Math.cos(a) * r, 60, ARENA - 60), clamp(cam.y + Math.sin(a) * r, 60, ARENA - 60), 0.7);
  }
  demo.boomT -= dt;
  if (demo.boomT <= 0) {
    demo.boomT = rand(0.35, 0.9);
    for (let i = 0; i < 6; i++) { const e = pick(enemies); if (e && !e.dead && e.spawnT <= 0) { e.dead = true; explode(e.x, e.y, e.color, e.size); break; } }
  }
  for (let i = 0; i < enemies.length; i++) if (!enemies[i].dead) updEnemy(enemies[i], dt);
  separate(); compact(enemies);
}
function step(dt) {
  if (state === 'play') G.time += dt;
  updTimers(dt);
  if (P.alive && state === 'play') updPlayer(dt);
  holes.length = 0;
  for (const e of enemies) if (e.type === 'hole' && !e.dead && e.spawnT <= 0) holes.push(e);
  for (let i = 0; i < enemies.length; i++) { const e = enemies[i]; if (!e.dead) updEnemy(e, dt); }
  separate();
  updPBullets(dt); updMissiles(dt); updEBullets(dt);
  if (P.alive && state === 'play') { updDrones(dt); contact(); }
  updPickups(dt);
  if (state === 'play') updWave(dt);
  if (G.comboT > 0) { G.comboT -= dt; if (G.comboT <= 0) { G.combo = 0; G.mult = 1; } }
  if (G.pickT > 0) G.pickT -= dt;
  compact(enemies); compact(pbullets); compact(ebullets); compact(pickups); compact(missiles);
}
function updCamera(rdt) {
  let tx, ty;
  if (state === 'title') { tx = ARENA / 2 + Math.cos(T * 0.13) * 260; ty = ARENA / 2 + Math.sin(T * 0.17) * 220; }
  else { tx = P.x + P.vx * 0.12; ty = P.y + P.vy * 0.12; }
  const k = 1 - Math.exp(-(state === 'title' ? 1.5 : 7) * rdt);
  cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
  /* margins in screen px beyond the arena walls, so the ship never hides under the HUD (top) or the buttons (bottom) */
  const topTarget = 85 + (boss && W <= 600 ? 42 : 0);
  camTopPx += (topTarget - camTopPx) * Math.min(1, rdt * 4);
  const hw = W / 2 / zoom, hh = H / 2 / zoom, mx = 45 / zoom, mt = (camTopPx + SA.t) / zoom, mb = (135 + SA.b) / zoom;
  const xl = hw - mx, xh = ARENA - hw + mx, yl = hh - mt, yh = ARENA - hh + mb;
  cam.x = xl > xh ? (xl + xh) / 2 : clamp(cam.x, xl, xh);
  cam.y = yl > yh ? (yl + yh) / 2 : clamp(cam.y, yl, yh);
}
let lastT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (!lastT) lastT = now;
  let rdt = (now - lastT) / 1000; lastT = now;
  if (!(rdt > 0)) rdt = 0; if (rdt > 0.1) rdt = 0.1;
  if (state === 'paused') { if (needRender) { needRender = false; render(); } return; }
  T += rdt;
  if (TS.t > 0) TS.t -= rdt;
  const dt = rdt * timeScale() * DBG.timeMul;
  if (state === 'play' || state === 'dying') {
    const n = Math.min(8, Math.max(1, Math.ceil(dt * 60 - 0.01))), h = dt / n;
    for (let i = 0; i < n; i++) { step(h); if (state !== 'play' && state !== 'dying') break; }

  } else if (state === 'title') demoStep(dt);

  for (let i = 0; i < 3; i++) GR.col[i] += (GR.tcol[i] - GR.col[i]) * Math.min(1, rdt * 2);
  trauma = Math.max(0, trauma - rdt * 1.4); sflashA = Math.max(0, sflashA - rdt * 2.4); dmgFlash = Math.max(0, dmgFlash - rdt * 1.8);
  updCamera(rdt);
  render();
  if (state === 'play' || state === 'dying') updHUD();
  perf(rdt);
}

/* ================= hot reload (keeps a run across republishes) ================= */
const SNAP_KEYS = ['hp', 'maxHp', 'speed', 'fireRate', 'dmg', 'shots', 'pierce', 'bounce', 'crit', 'dashMax', 'dashDmg', 'novaRate', 'nova', 'magnet', 'drones', 'chain', 'boom', 'missiles', 'shieldLv'];
function snapshot() {

    const p = {}; for (const k of SNAP_KEYS) p[k] = P[k];
    p.levels = Object.assign({}, P.levels);
    return { v: 1, run: { wave: G.wave, upgrade: state === 'upgrade', score: G.score, kills: G.kills, maxCombo: G.maxCombo, time: G.time, p } };
  } catch (e) { return { v: 1 }; }
}
function restoreRun(r) {
  try {

    resetWorld(); resetPlayer(); resetRunStats();
    for (const k of SNAP_KEYS) if (typeof r.p[k] === 'number' && isFinite(r.p[k])) P[k] = r.p[k];
    if (r.p.levels && typeof r.p.levels === 'object') P.levels = Object.assign({}, r.p.levels);
    if (P.shieldLv > 0) P.shield = 1;
    P.hp = clamp(Math.round(P.hp), 1, Math.max(1, P.maxHp));
    G.score = +r.score || 0; G.kills = +r.kills || 0; G.maxCombo = +r.maxCombo || 0; G.time = +r.time || 0;

    else { startWave(wave); pauseGame(); }
  } catch (e) { toMenu(); }
}

/* ================= boot ================= */
function boot(data) {
  AU.sfxOn = save.sfx !== false; AU.musOn = save.mus !== false;
  updToggles(); updBest(); setHowto(); setTheme(false, 1);
  resetPlayer(); resize();
  requestAnimationFrame(frame);

}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 250));
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') pauseGame(); });
['pointerup', 'touchend', 'click', 'keydown'].forEach(t => addEventListener(t, () => AU.unlock(), { passive: true }));
window.NS_DEBUG = { get state() { return state; }, G, P, enemies, ebullets, pickups, Q, PERF, DBG, get boss() { return boss; }, start: startGame, nova: tryNova, applyQuality,
  spawn: (t, x, y) => makeEnemy(t, x, y, 0.2), jump: n => { enemies.length = 0; ebullets.length = 0; boss = null; startWave(n); } };

if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => snapshot());
if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
})();
